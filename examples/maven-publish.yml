# Copy into a consuming project as .github/workflows/maven-publish.yml.
name: Publish

on:
  push:
    branches:
      - development
    tags:
      - 'release/*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to publish (e.g. release/1.0.0).  Defaults to this branch.'
        type: string
        required: false
        default: ''

jobs:
  publish:
    uses: handcraftedbits/github-workflows/.github/workflows/maven-publish.yml@v1
    with:
      ref: ${{ inputs.ref || '' }}
    # If names match exactly:
    # secrets: inherit
    secrets:
      # Optional; only needed if the exported key holds more than one usable secret key.
      GPG_KEY_FINGERPRINT: ${{ secrets.GPG_KEY_FINGERPRINT }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
